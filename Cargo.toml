[package]
name = "proresraw_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Pure-Rust Apple ProRes RAW decoder: Bayer sensel code values plus the camera metadata needed to linearize them"
repository = "https://github.com/gralk/proresraw_rs"
keywords = ["multimedia", "video", "prores", "raw", "bayer"]
categories = ["multimedia::encoding", "multimedia::video"]
publish = false

[features]
default = ["parallel", "runtime-fma"]
# Decode tile rows on a rayon thread pool.
parallel = ["dep:rayon"]
# On x86-64, run the raw-conversion kernels with AVX2 and FMA
# instructions when the CPU has them, detected at run time; results are
# identical either way. This is the crate's only unsafe code: without
# the feature the crate forbids unsafe code. Not needed when the build
# already targets FMA (for example `-C target-cpu=x86-64-v3`) or on
# other architectures.
runtime-fma = []
# Decode on a GPU through wgpu, with a device the caller provides.
gpu = ["dep:wgpu"]
# Dev only: expose the IDCT test-block generator and the synthetic frame
# generator (`synth`) to external test tooling.
testgen = []

[dependencies]
rayon = { version = "1.10", optional = true }
# Backend-agnostic: the application enables the wgpu backends it wants.
wgpu = { version = "27", default-features = false, features = ["std", "wgsl"], optional = true }

[dev-dependencies]
# For the prr2dng example.
anyhow = "1"
rayon = "1.10"
tempfile = "3"
pollster = "0.4"
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
