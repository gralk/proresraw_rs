[package]
name = "proresraw_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Pure-Rust Apple ProRes RAW decoder: Bayer sensel code values plus the camera metadata needed to linearize them"
repository = "https://github.com/gralk/proresraw_rs"
keywords = ["multimedia", "video", "prores", "raw", "bayer"]
categories = ["multimedia::encoding", "multimedia::video"]
publish = false

[features]
default = ["parallel"]
# Decode tile rows on a rayon thread pool.
parallel = ["dep:rayon"]
# Decode on a GPU through wgpu, with a device the caller provides.
gpu = ["dep:wgpu"]

[dependencies]
rayon = { version = "1.10", optional = true }
# Backend-agnostic: the application enables the wgpu backends it wants.
wgpu = { version = "27", default-features = false, features = ["std", "wgsl"], optional = true }

[dev-dependencies]
pollster = "0.4"
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
